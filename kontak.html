        <section class="kontak">
            <div class="container my-5">
                <h2 class="text-center mb-4">Hubungi Kami</h2>
                <p class="text-center text-muted mb-5">
                    Silakan isi formulir berikut untuk menghubungi tim Juragan Donat
                </p>

                <div class="card-body row justify-content-center">
                    <div class="col-lg-8">

                        <form id="kontakForm">

                            <!-- Nama -->
                            <div class="mb-3">
                                <label class="form-label">Nama</label>
                                <input type="text" class="form-control" id="nama">
                                <small class="text-danger" id="errorNama"></small>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                                <small class="text-danger" id="errorEmail"></small>
                            </div>

                            <!-- No HP -->
                            <div class="mb-3">
                                <label class="form-label">Nomor HP</label>
                                <input type="text" class="form-control" id="nohp" placeholder="Hanya angka">
                                <small class="text-danger" id="errorHP"></small>
                            </div>

                            <!-- Kategori -->
                            <div class="mb-3">
                                <label class="form-label">Kategori Pesan</label>
                                <select class="form-select" id="kategori">
                                    <option value="">-- Pilih Kategori --</option>
                                    <option value="umum">Umum</option>
                                    <option value="produk">Produk</option>
                                    <option value="kerjasama">Kerjasama</option>
                                </select>
                            </div>

                            <!-- Tanggal -->
                            <div class="mb-3">
                                <label class="form-label">Tanggal Pengiriman</label>
                                <input type="date" class="form-control" id="tanggal">
                                <small id="errorTanggal" class="text-danger"></small>
                            </div>

                            <!-- Jenis Pembayaran -->
                            <div class="mb-3">
                                <label class="form-label">Jenis Pembayaran</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="jenispembayaran" id="cod">
                                    <label class="form-check-label" for="cod">Cash</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="jenispembayaran" id="online">
                                    <label class="form-check-label" for="online">Transfer</label>
                                </div>
                                <small id="errorPembayaran" class="text-danger"></small>
                            </div>

                            <!-- Checkbox -->
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="langganan">
                                <label class="form-check-label">Saya ingin menerima newsletter</label>
                            </div>

                            <!-- Feedback -->
                            <div id="feedback" class="mb-3"></div>

                            <!-- Button -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Kirim</button>
                                <button type="button" id="clearForm" class="btn btn-outline-secondary">Clear Data</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
